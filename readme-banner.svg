<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Md. Estiak Rahman Ayon portfolio banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050c"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.78" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#335da6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#335da6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.15" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#4f2a8c" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4f2a8c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#51d8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#51d8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cecff"/>
      <stop offset="1" stop-color="#51d8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51d8ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="380" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Space background -->
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#glowBlue)"/>
    <rect width="1200" height="380" fill="url(#glowPurple)"/>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="310" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="70" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="320" cy="345" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="410" cy="30" r="1.1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="355" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="50" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="330" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="24" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="60" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="300" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="350" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="360" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="200" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="470" cy="300" r="0.9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Shooting star -->
    <line x1="0" y1="0" x2="70" y2="22" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.06;0.14" dur="7s" begin="2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="300 -20;700 110;700 110" keyTimes="0;0.14;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </line>

    <!-- Orbit system -->
    <g transform="translate(960 190)">
      <circle r="150" fill="url(#core)"/>

      <g>
        <circle r="150" fill="none" stroke="#8b5cf6" stroke-opacity="0.3"/>
        <circle cx="0" cy="-150" r="5" fill="#95ef75"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      </g>

      <g>
        <circle r="118" fill="none" stroke="#51d8ff" stroke-opacity="0.25" stroke-dasharray="4 6"/>
        <circle cx="118" cy="0" r="7" fill="#8b5cf6"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </g>

      <g>
        <circle r="86" fill="none" stroke="#51d8ff" stroke-opacity="0.35"/>
        <circle cx="-61" cy="-61" r="5.5" fill="#51d8ff"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </g>

      <!-- ER mark -->
      <rect x="-42" y="-42" width="84" height="84" rx="18" fill="#0a1220" stroke="#51d8ff" stroke-opacity="0.55" stroke-width="1.5"/>
      <g transform="translate(-32 -32)" fill="url(#ink)">
        <path d="M12 18H28V23H17V29.5H26V34.5H17V41H28V46H12Z"/>
        <path fill-rule="evenodd" d="M34 18H45A8.5 8.5 0 0 1 47.6 34.6L53 46H47.2L42.6 35.2H39V46H34ZM39 23V30.4H45A3.7 3.7 0 0 0 45 23Z"/>
      </g>
      <rect x="-42" y="-42" width="84" height="84" rx="18" fill="none" stroke="#51d8ff" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="-16 0" to="0 0" dur="0.8s" begin="0.2s" fill="freeze"/>
        <rect x="70" y="104" width="30" height="1.5" fill="#51d8ff"/>
        <text x="112" y="110" fill="#51d8ff" font-size="14" font-weight="600" letter-spacing="3">AI / ML  ·  MLOPS  ·  RESOURCE-EFFICIENT AI</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.5s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="0.9s" begin="0.5s" fill="freeze"/>
        <text x="68" y="178" fill="#eef5fd" font-size="52" font-weight="700" letter-spacing="-1">Md. Estiak Rahman Ayon</text>
      </g>

      <rect x="70" y="202" width="0" height="3" rx="1.5" fill="url(#line)">
        <animate attributeName="width" from="0" to="120" dur="0.9s" begin="1.1s" fill="freeze"/>
      </rect>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.3s" fill="freeze"/>
        <text x="70" y="246" fill="#a3b0c1" font-size="20">Applied AI for low-resource languages and limited compute,</text>
        <text x="70" y="276" fill="#a3b0c1" font-size="20">from research to production pipelines.</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.8s" fill="freeze"/>
        <circle cx="76" cy="318" r="4.5" fill="#95ef75">
          <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="90" y="323" fill="#717e8f" font-size="15">Available for opportunities</text>
      </g>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
</svg>
